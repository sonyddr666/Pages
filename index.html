<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b0d10">
  <title>Pages</title>
  <meta name="description" content="Hub de páginas HTML estáticas.">
  <style>
    :root{--bg:#0b0d10;--panel:#11151a;--panel2:#171c22;--text:#f4f7fb;--muted:#8f9baa;--line:#252c34;--accent:#8b5cf6;--accent2:#22d3ee;--ok:#22c55e;--shadow:0 18px 55px rgba(0,0,0,.28)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,rgba(139,92,246,.14),transparent 34rem),radial-gradient(circle at 90% 12%,rgba(34,211,238,.08),transparent 28rem),var(--bg);color:var(--text);min-height:100vh}
    a{color:inherit;text-decoration:none}button,input{font:inherit}.shell{width:min(1120px,calc(100% - 32px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 0}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.02em}.logo{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:var(--shadow)}.dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 20px rgba(139,92,246,.65)}.count{color:var(--muted);font-size:13px}.hero{padding:68px 0 40px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(17,21,26,.72);backdrop-filter:blur(10px);font-size:12px}.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--ok)}h1{font-size:clamp(42px,8vw,86px);line-height:.95;letter-spacing:-.065em;margin:20px 0 18px;max-width:850px}.lead{max-width:650px;margin:0;color:var(--muted);font-size:clamp(16px,2vw,20px)}.toolbar{position:sticky;top:10px;z-index:5;margin:26px 0 28px;display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:18px;background:rgba(11,13,16,.76);backdrop-filter:blur(18px);box-shadow:var(--shadow)}.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 14px}.search svg{width:18px;opacity:.55}.search input{width:100%;height:44px;border:0;outline:0;background:transparent;color:var(--text)}.search input::placeholder{color:#66707d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding-bottom:70px}.card{position:relative;display:flex;flex-direction:column;min-height:230px;padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(23,28,34,.94),rgba(17,21,26,.92));overflow:hidden;transition:.2s ease}.card:before{content:"";position:absolute;inset:-80px auto auto -80px;width:180px;height:180px;border-radius:50%;background:var(--glow,rgba(139,92,246,.1));filter:blur(24px);pointer-events:none}.card:hover{transform:translateY(-3px);border-color:#3b4652;box-shadow:0 18px 44px rgba(0,0,0,.22)}.cardTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.badge{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:rgba(11,13,16,.45)}.new{color:#c4b5fd;border-color:rgba(139,92,246,.34)}.arrow{font-size:24px;line-height:1;color:#6f7b88}.card h2{font-size:21px;line-height:1.1;letter-spacing:-.03em;margin:36px 0 10px}.desc{color:var(--muted);margin:0 0 20px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}.tag{font-size:11px;color:#a9b3bf;padding:4px 7px;border-radius:7px;background:#0d1116;border:1px solid #20262e}.empty{grid-column:1/-1;padding:52px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.footer{border-top:1px solid var(--line);padding:24px 0 44px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.kbd{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 6px;color:#b8c1cc}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding-top:44px}}
    @media(max-width:580px){.shell{width:min(100% - 22px,1120px)}.top{padding:18px 0}.hero{padding:38px 0 24px}.toolbar{top:6px;margin-top:18px}.grid{grid-template-columns:1fr}.card{min-height:205px}h1{font-size:clamp(44px,16vw,68px)}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="./" aria-label="Início"><span class="logo"><span class="dot"></span></span><span>Pages</span></a>
      <span class="count" id="count">carregando…</span>
    </header>

    <main>
      <section class="hero">
        <span class="eyebrow"><i></i> catálogo estático</span>
        <h1>Experimentos.<br>Direto no navegador.</h1>
        <p class="lead">Uma entrada única para os HTMLs publicados neste repositório. O mesmo conteúdo funciona em GitHub Pages, Cloudflare Pages e Render.</p>
      </section>

      <div class="toolbar">
        <label class="search" aria-label="Buscar páginas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Buscar página, descrição ou tag…" autocomplete="off">
        </label>
      </div>

      <section class="grid" id="grid" aria-live="polite"></section>
    </main>

    <footer class="footer"><span>sonyddr666 / Pages</span><span><span class="kbd">/</span> foca a busca · <span class="kbd">ESC</span> limpa</span></footer>
  </div>

  <script>
    const grid = document.querySelector('#grid');
    const search = document.querySelector('#search');
    const count = document.querySelector('#count');
    let pages = [];

    const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normalize = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const isNew = date => date && (Date.now() - new Date(date + 'T00:00:00').getTime()) < 1000*60*60*24*10;

    function render(){
      const q = normalize(search.value.trim());
      const list = pages.filter(p => normalize([p.title,p.description,...(p.tags||[])].join(' ')).includes(q));
      count.textContent = `${list.length} ${list.length === 1 ? 'página' : 'páginas'}`;
      if(!list.length){
        grid.innerHTML = `<div class="empty">${pages.length ? 'Nada encontrado. A humanidade sobrevive a mais uma busca sem resultado.' : 'Nenhuma página publicada ainda.'}</div>`;
        return;
      }
      grid.innerHTML = list.map((p,i) => {
        const href = p.file?.startsWith('http') ? p.file : `./paginas/${encodeURI(p.file || '')}`;
        const badge = isNew(p.created) ? '<span class="badge new">NOVO</span>' : `<span class="badge">${esc(p.category || 'HTML')}</span>`;
        const tags = (p.tags||[]).slice(0,5).map(t => `<span class="tag">${esc(t)}</span>`).join('');
        const glows = ['rgba(139,92,246,.12)','rgba(34,211,238,.10)','rgba(34,197,94,.09)','rgba(244,114,182,.08)'];
        return `<a class="card" href="${href}" style="--glow:${glows[i%glows.length]}">
          <div class="cardTop">${badge}<span class="arrow">↗</span></div>
          <h2>${esc(p.title || p.file || 'Sem título')}</h2>
          <p class="desc">${esc(p.description || 'Página HTML publicada no hub.')}</p>
          <div class="tags">${tags}</div>
        </a>`;
      }).join('');
    }

    async function load(){
      try{
        const res = await fetch(`./pages.json?v=${Date.now()}`, {cache:'no-store'});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        pages = Array.isArray(data) ? data : (data.pages || []);
        pages.sort((a,b) => String(b.created||'').localeCompare(String(a.created||'')));
      }catch(err){
        console.error('Falha ao carregar pages.json:', err);
        grid.innerHTML = '<div class="empty">Não foi possível carregar o catálogo <code>pages.json</code>.</div>';
        count.textContent = 'erro no catálogo';
        return;
      }
      render();
    }

    search.addEventListener('input', render);
    document.addEventListener('keydown', e => {
      if(e.key === '/' && document.activeElement !== search){ e.preventDefault(); search.focus(); }
      if(e.key === 'Escape'){ search.value=''; search.blur(); render(); }
    });
    load();
  </script>
</body>
</html>
