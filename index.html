<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="Catálogo das páginas HTML publicadas no repositório Pages.">
  <title>Pages — Catálogo</title>
  <style>
    :root{
      --bg:#f7f7f5;
      --surface:#ffffff;
      --surface-2:#f0f0ed;
      --text:#111111;
      --muted:#71716d;
      --muted-2:#999992;
      --line:#deded8;
      --line-dark:#c9c9c1;
      --accent:#6d4aff;
      --accent-soft:#eeeaff;
      --shadow:0 10px 35px rgba(0,0,0,.055);
      --radius:18px;
      --max:1120px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    button{color:inherit}
    .wrap{width:min(var(--max),calc(100% - 40px));margin:0 auto}

    .topbar{
      height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--line);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:750;
      letter-spacing:-.02em;
    }
    .brand-mark{
      width:31px;height:31px;border:1px solid #111;border-radius:9px;
      display:grid;place-items:center;background:#111;color:#fff;
      font-size:13px;font-weight:800;
    }
    .home-link{
      display:flex;align-items:center;gap:7px;
      font-size:14px;color:var(--muted);
      transition:.18s ease;
    }
    .home-link:hover{color:var(--text)}
    .home-link svg{width:16px;height:16px}

    .hero{padding:74px 0 38px}
    .hero h1{
      margin:0 0 12px;
      font-size:clamp(42px,7vw,72px);
      line-height:.98;
      letter-spacing:-.055em;
      font-weight:780;
    }
    .hero p{
      margin:0;
      max-width:700px;
      color:var(--muted);
      font-size:clamp(16px,2vw,20px);
      line-height:1.6;
    }

    .controls{padding:20px 0 26px}
    .searchbox{
      height:58px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 18px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:15px;
      box-shadow:0 1px 0 rgba(0,0,0,.02);
      transition:.18s ease;
    }
    .searchbox:focus-within{
      border-color:#b8b8af;
      box-shadow:0 0 0 4px rgba(0,0,0,.035);
    }
    .searchbox svg{width:21px;height:21px;color:var(--muted-2);flex:0 0 auto}
    .searchbox input{
      width:100%;
      height:100%;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:16px;
    }
    .searchbox input::placeholder{color:#a0a09a}

    .control-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin-top:18px;
    }
    .sort{
      display:inline-flex;
      padding:4px;
      border:1px solid var(--line);
      background:#eeeeea;
      border-radius:11px;
    }
    .sort button{
      border:0;
      background:transparent;
      cursor:pointer;
      padding:8px 13px;
      border-radius:8px;
      color:var(--muted);
      font-size:13px;
      font-weight:650;
      transition:.16s ease;
    }
    .sort button.active{
      background:var(--surface);
      color:var(--text);
      box-shadow:0 1px 4px rgba(0,0,0,.08);
    }
    .repo-link{
      font-size:13px;
      color:var(--muted);
      display:flex;align-items:center;gap:7px;
    }
    .repo-link:hover{color:var(--text)}
    .repo-link svg{width:16px;height:16px}

    .topics{
      display:flex;
      gap:8px;
      overflow-x:auto;
      scrollbar-width:none;
      padding:4px 0 22px;
    }
    .topics::-webkit-scrollbar{display:none}
    .topic{
      flex:0 0 auto;
      border:1px solid var(--line);
      background:transparent;
      padding:8px 13px;
      border-radius:999px;
      font-size:13px;
      color:var(--muted);
      cursor:pointer;
      transition:.16s ease;
    }
    .topic:hover{border-color:var(--line-dark);color:var(--text)}
    .topic.active{
      background:#111;
      color:#fff;
      border-color:#111;
    }

    .result-line{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:10px 0 16px;
      color:var(--muted);
      font-size:13px;
    }
    .result-line strong{color:var(--text);font-weight:650}
    .clear{
      border:0;background:none;padding:0;cursor:pointer;
      color:var(--muted);font-size:13px;
    }
    .clear:hover{color:var(--text)}

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
      padding-bottom:42px;
    }
    .card{
      min-width:0;
      min-height:240px;
      padding:22px;
      display:flex;
      flex-direction:column;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--surface);
      transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
      position:relative;
      overflow:hidden;
    }
    .card:hover{
      transform:translateY(-2px);
      border-color:var(--line-dark);
      box-shadow:var(--shadow);
    }
    .card:focus-visible{outline:3px solid rgba(109,74,255,.25);outline-offset:2px}
    .card-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      min-height:27px;
    }
    .category{
      font-size:12px;
      font-weight:700;
      color:var(--accent);
      background:var(--accent-soft);
      border-radius:999px;
      padding:5px 9px;
      max-width:70%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .arrow{
      width:28px;height:28px;border-radius:50%;
      display:grid;place-items:center;
      border:1px solid var(--line);
      color:var(--muted);
      transition:.18s ease;
    }
    .card:hover .arrow{
      background:#111;color:#fff;border-color:#111;
      transform:translate(1px,-1px);
    }
    .arrow svg{width:14px;height:14px}
    .card h2{
      margin:26px 0 10px;
      font-size:clamp(20px,2.4vw,27px);
      line-height:1.08;
      letter-spacing:-.035em;
    }
    .card .desc{
      margin:0 0 22px;
      color:var(--muted);
      line-height:1.55;
      font-size:14px;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:3;
      overflow:hidden;
    }
    .meta{
      margin-top:auto;
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:8px 13px;
      color:var(--muted-2);
      font-size:12px;
    }
    .meta span{display:inline-flex;align-items:center;gap:5px}
    .meta svg{width:13px;height:13px}
    .tag-row{
      display:flex;flex-wrap:wrap;gap:6px;
      margin-top:15px;
    }
    .tag{
      font-size:11px;
      color:#777770;
      background:var(--surface-2);
      border-radius:7px;
      padding:4px 7px;
    }
    .new-badge{
      color:#157347;
      background:#e8f6ed;
    }

    .empty{
      grid-column:1/-1;
      min-height:260px;
      border:1px dashed var(--line-dark);
      border-radius:var(--radius);
      display:grid;
      place-items:center;
      text-align:center;
      padding:36px;
      color:var(--muted);
      background:rgba(255,255,255,.42);
    }
    .empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:7px}
    .empty code{font-size:12px;background:#eee;padding:2px 5px;border-radius:5px}

    .load-wrap{text-align:center;padding:0 0 80px}
    .load-more{
      display:none;
      border:1px solid var(--line-dark);
      background:var(--surface);
      color:var(--text);
      border-radius:11px;
      padding:11px 18px;
      cursor:pointer;
      font-weight:650;
      font-size:13px;
      transition:.16s ease;
    }
    .load-more:hover{background:#111;color:#fff;border-color:#111}
    .load-more.show{display:inline-flex}

    footer{
      border-top:1px solid var(--line);
      padding:24px 0 38px;
      color:var(--muted);
      font-size:12px;
    }
    .footer-row{
      display:flex;justify-content:space-between;align-items:center;
      gap:16px;flex-wrap:wrap;
    }
    kbd{
      border:1px solid var(--line-dark);
      border-bottom-width:2px;
      background:var(--surface);
      border-radius:5px;
      padding:1px 5px;
      font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
      color:#555;
    }

    @media(max-width:760px){
      .wrap{width:min(var(--max),calc(100% - 24px))}
      .topbar{height:62px}
      .hero{padding:52px 0 26px}
      .control-row{align-items:flex-start}
      .repo-link span{display:none}
      .grid{grid-template-columns:1fr}
      .card{min-height:220px}
    }
    @media(max-width:480px){
      .hero h1{font-size:46px}
      .hero p{font-size:15px}
      .searchbox{height:54px}
      .sort{width:100%}
      .sort button{flex:1}
      .control-row{display:block}
      .repo-link{display:none}
      .card{padding:19px}
      .card h2{margin-top:22px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Página inicial">
        <span class="brand-mark">P</span>
        <span>Pages</span>
      </a>
      <a class="home-link" href="./" aria-label="Início">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        Início
      </a>
    </header>

    <main>
      <section class="hero">
        <h1>Pages</h1>
        <p>Experimentos, clones, interfaces e páginas HTML publicadas em um único lugar.</p>
      </section>

      <section class="controls" aria-label="Busca e filtros">
        <label class="searchbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="search" type="search" placeholder="Buscar por título, tema ou palavra-chave…" autocomplete="off" spellcheck="false">
        </label>

        <div class="control-row">
          <div class="sort" role="group" aria-label="Ordenação">
            <button id="recentBtn" class="active" type="button">Mais recentes</button>
            <button id="popularBtn" type="button">Mais acessados</button>
          </div>

          <a class="repo-link" href="https://github.com/sonyddr666/Pages" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .8a11.2 11.2 0 0 0-3.54 21.82c.56.1.76-.24.76-.54v-2.16c-3.12.68-3.78-1.32-3.78-1.32-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.68.08-.68 1.13.08 1.73 1.16 1.73 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.49-.28-5.1-1.24-5.1-5.53 0-1.22.43-2.22 1.16-3-.12-.28-.5-1.42.1-2.96 0 0 .94-.3 3.08 1.15A10.7 10.7 0 0 1 12 6.84c.95 0 1.9.13 2.8.38 2.13-1.45 3.07-1.15 3.07-1.15.6 1.54.22 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.3-2.62 5.24-5.12 5.52.4.35.76 1.03.76 2.08v3.08c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z"/></svg>
            <span>Ver repositório</span>
          </a>
        </div>
      </section>

      <nav class="topics" id="topics" aria-label="Categorias"></nav>

      <div class="result-line">
        <span id="count"><strong>0</strong> páginas</span>
        <button class="clear" id="clearBtn" type="button" hidden>Limpar filtros</button>
      </div>

      <section class="grid" id="grid" aria-live="polite"></section>

      <div class="load-wrap">
        <button id="loadMore" class="load-more" type="button">Carregar mais</button>
      </div>
    </main>

    <footer>
      <div class="footer-row">
        <span>sonyddr666 / Pages</span>
        <span><kbd>/</kbd> buscar &nbsp; <kbd>ESC</kbd> limpar</span>
      </div>
    </footer>
  </div>

  <script>
    const $ = s => document.querySelector(s);
    const grid = $('#grid');
    const topics = $('#topics');
    const search = $('#search');
    const count = $('#count');
    const clearBtn = $('#clearBtn');
    const recentBtn = $('#recentBtn');
    const popularBtn = $('#popularBtn');
    const loadMore = $('#loadMore');

    let pages = [];
    let category = 'Todos';
    let sortMode = 'recent';
    let visible = 12;

    const esc = (value='') => String(value).replace(/[&<>"']/g, char => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[char]));

    const normalize = value => String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .toLowerCase();

    const parseDate = value => {
      const time = Date.parse(value || '');
      return Number.isFinite(time) ? time : 0;
    };

    const isNew = value => {
      const time = parseDate(value);
      return time && (Date.now() - time) < 1000 * 60 * 60 * 24 * 10;
    };

    const formatDate = value => {
      if (!value) return 'Sem data';
      const date = new Date(value.includes('T') ? value : value + 'T12:00:00');
      if (Number.isNaN(date.getTime())) return value;
      return new Intl.DateTimeFormat('pt-BR', {
        day:'numeric', month:'long', year:'numeric'
      }).format(date);
    };

    function pageHref(page){
      const file = page.file || '';
      if (/^https?:\/\//i.test(file)) return file;
      if (file.startsWith('./') || file.startsWith('../') || file.startsWith('/')) return file;
      return './paginas/' + file.split('/').map(encodeURIComponent).join('/');
    }

    function getCategory(page){
      return String(page.category || (page.tags && page.tags[0]) || 'Outros').trim() || 'Outros';
    }

    function getViews(page){
      const value = Number(page.views ?? page.accesses ?? page.hits ?? 0);
      return Number.isFinite(value) ? value : 0;
    }

    function renderTopics(){
      const categories = [...new Set(pages.map(getCategory))].sort((a,b) => a.localeCompare(b,'pt-BR'));
      const all = ['Todos', ...categories];
      topics.innerHTML = all.map(name => `
        <button type="button" class="topic ${name === category ? 'active' : ''}" data-category="${esc(name)}">
          ${esc(name)}
        </button>
      `).join('');

      topics.querySelectorAll('.topic').forEach(btn => {
        btn.addEventListener('click', () => {
          category = btn.dataset.category;
          visible = 12;
          renderTopics();
          render();
        });
      });
    }

    function filteredPages(){
      const q = normalize(search.value.trim());
      let list = pages.filter(page => {
        const categoryOk = category === 'Todos' || getCategory(page) === category;
        if (!categoryOk) return false;

        if (!q) return true;
        const searchable = [
          page.title,
          page.description,
          page.file,
          getCategory(page),
          ...(page.tags || [])
        ].join(' ');
        return normalize(searchable).includes(q);
      });

      list.sort((a,b) => {
        if (sortMode === 'popular') {
          return getViews(b) - getViews(a) || parseDate(b.created) - parseDate(a.created);
        }
        return parseDate(b.created) - parseDate(a.created) ||
               String(a.title || '').localeCompare(String(b.title || ''),'pt-BR');
      });

      return list;
    }

    function cardHTML(page){
      const cat = getCategory(page);
      const tags = (page.tags || []).filter(tag => normalize(tag) !== normalize(cat)).slice(0,4);
      const views = getViews(page);
      const readTime = page.readTime || page.read_time || page.time || '';

      return `
        <a class="card" href="${esc(pageHref(page))}" ${/^https?:\/\//i.test(page.file || '') ? 'target="_blank" rel="noopener"' : ''}>
          <div class="card-head">
            <span class="category ${isNew(page.created) ? 'new-badge' : ''}">${isNew(page.created) ? 'Novo' : esc(cat)}</span>
            <span class="arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
            </span>
          </div>

          <h2>${esc(page.title || page.file || 'Página sem título')}</h2>
          <p class="desc">${esc(page.description || 'Página HTML publicada no catálogo.')}</p>

          <div class="meta">
            <span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              ${esc(formatDate(page.created))}
            </span>
            ${readTime ? `<span>${esc(readTime)}</span>` : ''}
            ${views ? `<span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              ${views.toLocaleString('pt-BR')}
            </span>` : ''}
          </div>

          ${tags.length ? `<div class="tag-row">${tags.map(tag => `<span class="tag">${esc(tag)}</span>`).join('')}</div>` : ''}
        </a>
      `;
    }

    function render(){
      const list = filteredPages();
      const shown = list.slice(0, visible);

      count.innerHTML = `<strong>${list.length}</strong> ${list.length === 1 ? 'página' : 'páginas'}`;
      clearBtn.hidden = !(search.value.trim() || category !== 'Todos');

      if (!list.length) {
        grid.innerHTML = `
          <div class="empty">
            <div>
              <strong>${pages.length ? 'Nada encontrado' : 'Nenhuma página publicada ainda'}</strong>
              ${pages.length
                ? 'Tente outro termo ou limpe os filtros.'
                : 'Quando um HTML for cadastrado em <code>pages.json</code>, ele aparece aqui automaticamente.'}
            </div>
          </div>`;
        loadMore.classList.remove('show');
        return;
      }

      grid.innerHTML = shown.map(cardHTML).join('');
      loadMore.classList.toggle('show', visible < list.length);
    }

    function clearFilters(){
      search.value = '';
      category = 'Todos';
      visible = 12;
      renderTopics();
      render();
    }

    function setSort(mode){
      sortMode = mode;
      visible = 12;
      recentBtn.classList.toggle('active', mode === 'recent');
      popularBtn.classList.toggle('active', mode === 'popular');
      render();
    }

    async function load(){
      try{
        const response = await fetch('./pages.json?v=' + Date.now(), {cache:'no-store'});
        if(!response.ok) throw new Error('HTTP ' + response.status);

        const data = await response.json();
        pages = Array.isArray(data) ? data : Array.isArray(data.pages) ? data.pages : [];

        renderTopics();
        render();
      }catch(error){
        console.error('Falha ao carregar pages.json:', error);
        grid.innerHTML = `
          <div class="empty">
            <div>
              <strong>Não foi possível carregar o catálogo</strong>
              Verifique se <code>pages.json</code> existe e contém JSON válido.
            </div>
          </div>`;
        count.innerHTML = '<strong>0</strong> páginas';
      }
    }

    search.addEventListener('input', () => {
      visible = 12;
      render();
    });

    clearBtn.addEventListener('click', clearFilters);
    recentBtn.addEventListener('click', () => setSort('recent'));
    popularBtn.addEventListener('click', () => setSort('popular'));

    loadMore.addEventListener('click', () => {
      visible += 12;
      render();
    });

    document.addEventListener('keydown', event => {
      if (event.key === '/' && document.activeElement !== search) {
        event.preventDefault();
        search.focus();
      }
      if (event.key === 'Escape') {
        clearFilters();
        search.blur();
      }
    });

    load();
  </script>
</body>
</html>
